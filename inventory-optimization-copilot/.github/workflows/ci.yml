name: CI

on:
  push:
    branches: [feature/inventory-optimization-copilot]
    paths:
      - "inventory-optimization-copilot/**"
  pull_request:
    paths:
      - "inventory-optimization-copilot/**"

defaults:
  run:
    working-directory: inventory-optimization-copilot

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall src config

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy src config

      - name: Pytest with coverage
        run: |
          pytest --cov=src/services --cov=src/domain/validation \
            --cov-report=term-missing --cov-fail-under=85 -q

      - name: Build workbook
        run: python src/main.py

      - name: Validate workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          from config.workbook_config import OUTPUT_FILENAME, SHEET_ORDER, WORKBOOK_PATH
          from openpyxl import load_workbook
          from src.workbook.validator import validate_workbook_file

          validate_workbook_file(WORKBOOK_PATH)
          wb = load_workbook(WORKBOOK_PATH, read_only=True)
          try:
              assert wb.sheetnames == SHEET_ORDER
              assert len(wb.sheetnames) == 14
              assert OUTPUT_FILENAME == "Inventory_Optimization_Copilot.xlsx"
          finally:
              wb.close()
          print("Workbook validation passed")
          PY

      - name: Upload workbook artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Inventory_Optimization_Copilot
          path: inventory-optimization-copilot/dist/Inventory_Optimization_Copilot.xlsx
          if-no-files-found: error
